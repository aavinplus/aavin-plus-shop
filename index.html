<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f4;color:#173122;font-family:Arial,"Noto Sans Tamil",sans-serif}
header{background:linear-gradient(135deg,#087a3d,#0fa85a);color:#fff;padding:20px 15px 18px;border-radius:0 0 26px 26px;box-shadow:0 5px 18px #0002}

</style></head>
<body>

"cat":"heritage","name":"ஹெரிடேஜ் நெய்","size":"200 கிராம்","price":190,"emoji":"🫙"},{"cat":"heritage","name":"ஹெரிடேஜ் நெய்","size":"500 கிராம்","price":440,"emoji":"🫙"},{"cat":"heritage","name":"ஹெரிடேஜ் நெய்","size":"1000 கிராம்","price":880,"emoji":"🫙"}]; let cart={}; let current='all';
const grid=document.getElementById('grid');
function draw(){const q=document.getElementById('search').value.toLowerCase();grid.innerHTML='';
products.forEach((p,i)=>{if((current==='all'||p.cat===current)&&(!q||(p.name+' '+p.size).toLowerCase().includes(q))){
grid.insertAdjacentHTML('beforeend',`<article class="card"><div class="photo"><span class="badge">${p.cat==='aavin'?'AAVIN':'HERITAGE'}</span>${p.emoji}</div><div class="name">${p.name}</div><div class="size">${p.size}</div><div class="price">₹${p.price}</div><div class="q"><button onclick="change(${i},-1)">−</button><span>${cart[i]||0}</span><button onclick="change(${i},1)">+</button></div></article>`)}})}
function change(i,d){cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];draw();update()}
function update(){let c=0,t=0;Object.keys(cart).forEach(i=>{c+=cart[i];t+=cart[i]*products[i].price});document.getElementById('count').textContent=c;document.getElementById('total').textContent=t}
function cat(x,b){current=x;document.querySelectorAll('.chips button').forEach(v=>v.classList.remove('on'));b.classList.add('on');draw()}
function openCart(){let h='';Object.keys(cart).forEach(i=>{let p=products[i];h+=`<div class="row"><span>${p.name}<br><small>${p.size} × ${cart[i]}</small></span><b>₹${p.price*cart[i]}</b></div>`});document.getElementById('items').innerHTML=h||'<p>Cart காலியாக உள்ளது.</p>';document.getElementById('ctotal').textContent=document.getElementById('total').textContent;document.getElementById('modal').style.display='flex'}
function closeCart(){document.getElementById('modal').style.display='none'}
function sendOrder(){if(!Object.keys(cart).length)return alert('முதலில் பொருட்களை Cart-ல் சேர்க்கவும்');let n=document.getElementById('name').value.trim(),ph=document.getElementById('phone').value.trim(),a=document.getElementById('addr').value.trim(),pay=document.querySelector('input[name=pay]:checked').value;if(!n||!ph||!a)return alert('பெயர், மொபைல் எண், முகவரி நிரப்பவும்');let lines=Object.keys(cart).map(i=>`• ${products[i].name} (${products[i].size}) × ${cart[i]} = ₹${products[i].price*cart[i]}`).join('\n');let msg=`*Aavin Plus - புதிய Order*%0A%0Aவாடிக்கையாளர்: ${encodeURIComponent(n)}%0Aமொபைல்: ${encodeURIComponent(ph)}%0Aமுகவரி: ${encodeURIComponent(a)}%0APayment: ${encodeURIComponent(pay)}%0A%0A${encodeURIComponent(lines)}%0A%0A*மொத்தம்: ₹${document.getElementById('total').textContent}*`;window.open('https://wa.me/918110044400?text='+msg,'_blank')}

</script></body></html>
